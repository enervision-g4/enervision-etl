name: CI

on:
  push:
    branches: [develop, main]
  pull_request:
    branches: [develop, main]

permissions:
  contents: read

jobs:
  lints:
    uses: enervision-g4/enervision-devops/.github/workflows/lint.yml@main

  ci:
    uses: enervision-g4/enervision-devops/.github/workflows/ci.yml@main
    with:
      language: python
      working-directory: .
      run-tests: true
      dockerfile: Dockerfile
