[project]
name = "enervision-etl"
version = "0.1.0"
description = "Pipeline ETL EnerVision : extraction API mock, imputation tracee, publication Kafka"
requires-python = ">=3.14"
dependencies = [
    "pydantic>=2.9",
    "pydantic-settings>=2.7",
    "requests>=2.32",
    "confluent-kafka>=2.6",
    "prometheus-client>=0.21",
    "structlog>=24.4",
    "typer>=0.15",
    # Windows ne fournit aucune base de fuseaux horaires : zoneinfo la lit dans ce paquet.
    "tzdata>=2024.1 ; sys_platform == 'win32'",
]

[project.scripts]
enervision-etl = "enervision_etl.cli:application"

[dependency-groups]
dev = [
    "pytest>=8.3",
    "pytest-cov>=6.0",
    "responses>=0.25",
    "freezegun>=1.5",
    "ruff>=0.8",
    "mypy>=1.13",
    "types-requests>=2.32",
    "pdoc>=15.0",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/enervision_contracts", "src/enervision_etl"]

[tool.pytest.ini_options]
testpaths = ["tests"]
# import-mode=importlib affranchit l'arborescence de tests de la contrainte de noms
# de fichiers uniques, que le miroir des paquets rend probable.
addopts = "-v --strict-markers --import-mode=importlib"

[tool.ruff]
line-length = 100
target-version = "py313"

[tool.ruff.lint]
select = ["E", "F", "I", "N", "UP", "B", "ANN", "RUF", "D"]
# Les regles de codage du projet imposent Optional[X] plutot que la forme X | None.
# D107 : le contrat du constructeur est decrit dans la docstring de la classe.
ignore = ["UP007", "UP045", "D107"]

[tool.ruff.lint.pydocstyle]
convention = "google"

[tool.ruff.lint.per-file-ignores]
# Les tests se documentent par leur nom, pas par une docstring.
"tests/*" = ["ANN", "D"]
"scripts/*" = ["D103"]

[tool.mypy]
strict = true
# Les scripts consomment l'API publique du paquet : les inclure fait echouer la
# verification des qu'une signature change sans que les appelants suivent.
files = ["src", "scripts"]
