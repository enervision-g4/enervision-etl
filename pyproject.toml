[project]
name = "enervision-etl"
version = "0.1.0"
description = "Pipeline ETL EnerVision : extraction API mock, imputation tracee, publication Kafka"
requires-python = ">=3.14"
dependencies = [
    "pydantic>=2.9",
    "pydantic-settings>=2.7",
    "requests>=2.32",
    "confluent-kafka>=2.6",
    "prometheus-client>=0.21",
    "structlog>=24.4",
    "typer>=0.15",
    # Windows ne fournit aucune base de fuseaux horaires : zoneinfo la lit dans ce paquet.
    "tzdata>=2024.1 ; sys_platform == 'win32'",
]

[dependency-groups]
dev = [
    "pytest>=8.3",
    "pytest-cov>=6.0",
    "responses>=0.25",
    "freezegun>=1.5",
    "ruff>=0.8",
    "mypy>=1.13",
    "types-requests>=2.32",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/enervision_etl"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-v --strict-markers"

[tool.ruff]
line-length = 100
target-version = "py313"

[tool.ruff.lint]
select = ["E", "F", "I", "N", "UP", "B", "ANN", "RUF"]
# Les regles de codage du projet imposent Optional[X] plutot que la forme X | None.
ignore = ["UP007", "UP045"]

[tool.ruff.lint.per-file-ignores]
"tests/*" = ["ANN"]

[tool.mypy]
strict = true
files = ["src"]
